[project]
name = "news_agent"
version = "0.1.0"
description = "AI-powered news digest agent using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.1.10",
    "openai==2.30.0",
    "feedparser==6.0.12",
    "aiohttp==3.13.5",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml==6.0.3",
    "pytz>=2026.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langfuse>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "ruff==0.8.0",
    "mypy==1.15.0",
]

[tool.ruff.lint]
extend-ignore = ["E402"]
