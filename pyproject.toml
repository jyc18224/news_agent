[project]
name = "news_agent"
version = "0.1.0"
description = "AI-powered news digest agent using LangGraph"
requires-python = ">=3.11"
dependencies = [
    # Core AI/ML dependencies
    "langgraph==1.1.10",
    "sentence-transformers==3.0.1",
    "chromadb==0.5.5",
    "openai==2.30.0",
    # Data fetching & parsing
    "feedparser==6.0.12",
    "aiohttp==3.13.5",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    # Configuration & utilities
    "python-frontmatter==1.1.0",
    "pyyaml==6.0.3",
    "numpy<2.0.0",  # 避免与 chromadb 0.5.5 冲突
    "pytz>=2026.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "ruff==0.8.0",
    "mypy==1.15.0",
]
